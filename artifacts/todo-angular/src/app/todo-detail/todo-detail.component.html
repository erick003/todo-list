<div class="min-h-screen bg-gradient-to-br from-slate-100 to-blue-50 p-6">
  <div class="max-w-2xl mx-auto">

    <!-- Cabeçalho com navegação -->
    <div class="flex items-center gap-3 mb-8">
      <p-button icon="pi pi-arrow-left" [text]="true" [rounded]="true"
        pTooltip="Voltar" tooltipPosition="right"
        (onClick)="goBack()">
      </p-button>
      <div>
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Detalhes da Tarefa</h1>
        <p class="text-gray-400 text-sm mt-0.5">Rota: /todos/{{ todo()?.id }}</p>
      </div>
    </div>

    @if (todo()) {
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 flex flex-col gap-6">

        <!-- Título -->
        <div>
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Título</label>
          <p class="text-gray-900 font-semibold mt-2 text-xl leading-snug">{{ todo()!.text }}</p>
        </div>

        <hr class="border-gray-100">

        <!-- Descrição -->
        <div>
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Descrição</label>
          <p class="text-gray-600 mt-2 leading-relaxed">{{ todo()!.description || 'Sem descrição' }}</p>
        </div>

        <hr class="border-gray-100">

        <!-- Prioridade + Status -->
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Prioridade</label>
            <div class="mt-2">
              <p-tag [value]="getPriorityLabel(todo()!.priority)" [severity]="getPrioritySeverity(todo()!.priority)"></p-tag>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Status</label>
            <div class="mt-2">
              <p-tag
                [value]="todo()!.completed ? 'Concluída' : 'Pendente'"
                [severity]="todo()!.completed ? 'success' : 'warning'">
              </p-tag>
            </div>
          </div>
        </div>

        <hr class="border-gray-100">

        <!-- ID + Data -->
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="text-xs font-semibold text-gray-400 uppercase tracking-widest">ID</label>
            <p class="text-gray-600 mt-2 font-mono text-sm">#{{ todo()!.id }}</p>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Criado em</label>
            <p class="text-gray-600 mt-2 text-sm">{{ todo()!.createdAt | date:'dd/MM/yyyy' }}</p>
            <p class="text-gray-400 text-xs">{{ todo()!.createdAt | date:'HH:mm' }}</p>
          </div>
        </div>

        <!-- Ações -->
        <div class="flex justify-end gap-2 pt-2">
          <p-button label="Voltar"  icon="pi pi-arrow-left" [outlined]="true" (onClick)="goBack()"></p-button>
          <p-button label="Editar"  icon="pi pi-pencil"                        (onClick)="goToEdit()"></p-button>
        </div>

      </div>
    } @else {
      <div class="bg-white rounded-2xl p-16 shadow-sm border border-gray-100 text-center">
        <i class="pi pi-exclamation-circle text-5xl text-gray-200 mb-4 block"></i>
        <p class="text-gray-400 font-medium">Tarefa não encontrada</p>
        <p-button label="Voltar para a lista" [text]="true" (onClick)="goBack()" styleClass="mt-4"></p-button>
      </div>
    }

  </div>
</div>
